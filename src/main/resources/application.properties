# ---------------------------------------------------------------------------
# Personal Finance Manager
# Defaults are development-friendly; every value below can be overridden with an
# environment variable, which is how the deployed instance is configured.
# ---------------------------------------------------------------------------

spring.application.name=personal-finance-manager
server.port=${PORT:8080}

# --- Datasource ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# --- Session ---------------------------------------------------------------
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# --- CORS ------------------------------------------------------------------
app.cors.allowed-origin-patterns=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],https://*.onrender.com}

# --- Error responses -------------------------------------------------------
# Stack traces and internal messages never belong in a response body.
server.error.include-stacktrace=never
server.error.include-message=never

# --- Logging ---------------------------------------------------------------
logging.level.root=${LOG_LEVEL:INFO}
